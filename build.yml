name: Build Lakshmi Assistant APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Folders
      run: |
        mkdir -p app/src/main/java/com/example/lakshmiassistant
        mkdir -p app/src/main/res/layout

    - name: Create Root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:7.4.2"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Create settings.gradle
      run: |
        echo "include ':app'" > settings.gradle

    - name: Create App build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'

        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.example.lakshmiassistant"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Add AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.lakshmiassistant">
            
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.CALL_PHONE" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            
            <application android:label="Lakshmi Assistant" android:allowBackup="true" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".LakshmiService" android:exported="false" android:foregroundServiceType="microphone" />
            </application>
        </manifest>
        EOF

    - name: Add LakshmiService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/example/lakshmiassistant/LakshmiService.java
        package com.example.lakshmiassistant;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class LakshmiService extends Service {
            private static final String CHANNEL_ID = "LakshmiServiceChannel";

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                createNotificationChannel();
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Lakshmi Assistant Running")
                        .setContentText("Background service is active...")
                        .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                        .build();

                startForeground(1, notification);
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel serviceChannel = new NotificationChannel(
                            CHANNEL_ID, "Lakshmi Service Channel", NotificationManager.IMPORTANCE_DEFAULT
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) { manager.createNotificationChannel(serviceChannel); }
                }
            }
        }
        EOF

    - name: Add MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/example/lakshmiassistant/MainActivity.java
        package com.example.lakshmiassistant;
        import android.Manifest;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.widget.Button;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import java.util.ArrayList;

        public class MainActivity extends AppCompatActivity {
            private SpeechRecognizer speechRecognizer;
            private TextView tvStatus, tvCommand;
            private Button btnListen, btnStartService;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                tvStatus = findViewById(R.id.tvStatus);
                tvCommand = findViewById(R.id.tvCommand);
                btnListen = findViewById(R.id.btnListen);
                btnStartService = findViewById(R.id.btnStartService);
                
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CALL_PHONE}, 100);
                }

                btnStartService.setOnClickListener(v -> {
                    Intent serviceIntent = new Intent(this, LakshmiService.class);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        startForegroundService(serviceIntent);
                    } else {
                        startService(serviceIntent);
                    }
                    tvStatus.setText("Background Service Started!");
                });

                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                Intent speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);

                speechRecognizer.setRecognitionListener(new RecognitionListener() {
                    @Override public void onReadyForSpeech(Bundle params) { tvStatus.setText("Lakshmi sun rahi hai..."); }
                    @Override public void onResults(Bundle results) {
                        ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                        if (matches != null && !matches.isEmpty()) {
                            String cmd = matches.get(0).toLowerCase();
                            tvCommand.setText("Aapne bola: " + cmd);
                            if (cmd.contains("youtube") || cmd.contains("gana")) {
                                startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + cmd)));
                            } else if (cmd.contains("whatsapp")) {
                                startActivity(getPackageManager().getLaunchIntentForPackage("com.whatsapp"));
                            }
                        }
                    }
                    @Override public void onBeginningOfSpeech() {}
                    @Override public void onRmsChanged(float rmssdB) {}
                    @Override public void onBufferReceived(byte[] buffer) {}
                    @Override public void onEndOfSpeech() {}
                    @Override public void onError(int error) { tvStatus.setText("Error, phir try karein"); }
                    @Override public void onPartialResults(Bundle partialResults) {}
                    @Override public void onEvent(int eventType, Bundle params) {}
                });

                btnListen.setOnClickListener(v -> speechRecognizer.startListening(speechIntent));
            }
        }
        EOF

    - name: Add activity_main.xml Layout
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="24dp">
            <TextView android:id="@+id/tvStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Lakshmi Assistant Ready" android:textSize="20sp" />
            <TextView android:id="@+id/tvCommand" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Controls niche hain" android:textSize="16sp" android:layout_marginTop="16dp" />
            <Button android:id="@+id/btnStartService" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Start Background Service ⚡" android:layout_marginTop="24dp" />
            <Button android:id="@+id/btnListen" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Speak Now 🎙️" android:layout_marginTop="16dp" />
        </LinearLayout>
        EOF

    - name: Setup Gradle Wrapper with specific version 7.5
      run: |
        gradle wrapper --gradle-version 7.5

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lakshmi-service-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
